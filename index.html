<style>

.mon{display:flex;align-items:center;gap:14px;background:var(--c);border:1px solid var(--bd);border-radius:12px;padding:8px 14px;font-weight:700}
.mon button{background:none;border:0;font-size:22px;cursor:pointer;color:var(--tx)}
.sub{color:var(--mu);font-size:12.5px}
.k3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-bottom:14px}.k3.k4{grid-template-columns:repeat(4,1fr);gap:8px}.k3.k4 .k{padding:8px 12px;border-radius:12px}.k3.k4 .k small{font-size:12px;margin-bottom:2px}.k3.k4 .k b{font-size:18px}.k3.k4 .k .em{width:34px;height:34px;font-size:17px;border-radius:10px}.chips{display:flex;flex-wrap:wrap;gap:4px;margin:6px 0 3px}.chip{background:#e3ecfd;color:#1d4ed8;border-radius:8px;padding:3px 9px;font-size:12.5px;font-weight:600}.chip.bad{background:#fbdada;color:#b91c1c}.chip.ok{background:#d5f1e3;color:#15803d}

.k .em{width:54px;height:54px;border-radius:14px;display:grid;place-items:center;font-size:26px}
.kb{background:#eef4ff;border-color:#d6e3fb;color:var(--bl)}.kb .em{background:#dce8fd}
.kr{background:#fff0f0;border-color:#f8d6d6;color:var(--rd)}.kr .em{background:#fbdada}

.bd{display:inline-block;padding:2px 12px;border-radius:99px;font-size:13px;font-weight:700;white-space:nowrap}

.ic{background:none;border:0;cursor:pointer;font-size:15px;padding:3px}
.dn{display:flex;flex-direction:column;align-items:center;gap:12px}.lgd{width:100%;font-size:13px}.lgd div{display:flex;align-items:center;gap:8px;padding:3px 0}.lgd i{width:10px;height:10px;border-radius:50%}.lgd span{margin-right:auto;color:var(--mu)}
.fl{display:grid;grid-template-columns:1fr 1fr 1fr 1.4fr auto;gap:10px;align-items:end;margin-bottom:10px}.tabs{display:flex;gap:8px;margin-bottom:14px}.tabs button{border:0;border-radius:10px;padding:10px 20px;font:inherit;font-weight:700;cursor:pointer;background:#eef1f6;color:var(--mu)}

.fm{display:grid;grid-template-columns:1fr 1fr 1.3fr 1.3fr auto;gap:10px;align-items:end;margin-bottom:14px}

.mb{background:#fff;border-radius:16px;padding:20px;width:min(420px,92vw);display:grid;gap:12px;max-height:90vh;overflow:auto}.mb h3{margin:0}.row{display:flex;gap:8px}

.lc{max-width:380px;margin:8vh auto;text-align:center}.lc .lg{width:64px;height:64px;font-size:32px;margin:0 auto 10px}.lc h1{margin:0 0 4px;font-size:30px}.lc label{text-align:right;margin-bottom:10px}
@media(max-width:1100px){.fl{grid-template-columns:1fr 1fr}.g3{grid-template-columns:1fr}.fm{grid-template-columns:1fr 1fr}}
.ls{display:none}nav .i{position:relative}.dot{position:absolute;top:5px;left:50%;margin-left:6px;width:11px;height:11px;border-radius:50%;background:#ff4d4f;border:2px solid var(--nav)}.nvt{background:none;border:1px solid #3a4a73;color:#9fb0d4;border-radius:8px;font:inherit;font-size:10px;padding:7px 2px;margin-bottom:10px;cursor:pointer}#nvs{display:none;position:fixed;top:calc(8px + env(safe-area-inset-top,0px));right:8px;width:44px;height:44px;border-radius:50%;border:0;background:var(--nav);color:#fff;font-size:20px;place-items:center;z-index:6;box-shadow:0 2px 8px #0005}.login #nvs{display:none!important}.mb select{width:100%;padding:10px;margin-top:6px;border:1px solid var(--bd);border-radius:10px;font:inherit;background:#fff}
@media(max-width:800px){body.nvh nav{display:none}body.nvh main{padding-top:58px}body.nvh #nvs{display:grid}nav{width:58px;height:100vh;height:100dvh;padding:calc(10px + env(safe-area-inset-top,0px)) 3px calc(10px + env(safe-area-inset-bottom,0px));overflow-y:auto}
.brand{font-size:0;justify-content:center;margin:0 0 12px}nav .lg{width:38px;height:38px}
nav .i{flex-direction:column;gap:3px;padding:10px 1px;font-size:10px;text-align:center;justify-content:center;border-right:0;border-radius:10px;line-height:1.25}nav .i span:first-child{font-size:21px}
.lf{display:none}.ls{display:inline}
.me{padding:0;background:none}.me b{display:block;font-size:10px;text-align:center;margin-bottom:4px}.me .sub{display:none}.out{font-size:10.5px;padding:9px 2px;margin-top:4px}
main{padding:8px 6px}table{min-width:0!important}th,td{padding:8px 4px;font-size:12.5px}.bd{padding:2px 8px;font-size:12px}.k3,.k2{grid-template-columns:1fr}.k3.k4{grid-template-columns:repeat(2,1fr)}.k3.k4 .em{display:none}.fm,.fl{grid-template-columns:1fr}
label input,label select,.mb select{font-size:16px}.card{padding:10px}.k b{font-size:24px}.btn{padding:11px 14px}}
</style></head><body><div class="app"><nav id="nav"></nav><main id="m"><p>جارٍ التحميل…</p></main></div>

<script>
const SH={home:'الرئيسية',plan:'الرواتب',obl:'الالتزامات',ledger:'الدفتر',arch:'الإقفال',bak:'النسخ',log:'السجل'};
const TABS=[['home','🏠','الرئيسية'],['ledger','📒','دفتر التسجيل اليومي'],['plan','💵','الرواتب وإعداد الالتزامات'],['obl','🧾','الالتزامات والسداد'],['arch','🔒','الإقفال والأرشيف'],['bak','💾','النسخ الاحتياطي'],['log','🕘','سجل التعديلات']];
const PAL=['#3b6fd4','#e24b4b','#2fb67c','#f2a93b','#9b6bdc','#38a3d6','#8a93a6','#e07aa6','#5bbf9a','#c9a227','#6a7fdb','#d9825b','#4ba3a3','#a0a0d6','#7aa84b'];
const SEED_C=[['البيت',1500,'مشترك'],['مقاضي البيت',1300,'ريان'],['قرض ريان',1000,'ريان'],['قرض السيارة',1500,''],['قرض التعليم',1550,'عبدالعزيز'],['مصروف النساء',1200,'مشترك'],['الأطفال',1300,'عبدالعزيز'],['الغاز',1000,'مشترك'],['الشركة',1200,'مشترك'],['الاستراحة',500,''],['مصروف الأطفال الصباحي',500,'عبدالعزيز'],['الكهرباء',780,'عبدالعزيز'],['الإنترنت',175,''],['الادخار',500,'مشترك'],['جوي',230,'']];
const SEED_I=[['راتب المسجد','ريان',28,2385],['راتب العمل','ريان',1,4000],['الضمان الاجتماعي','ريان',1,1210],['الضمان الاجتماعي','عبدالعزيز',1,4546],['حساب المواطن','ريان',10,1296],['حساب المواطن','عبدالعزيز',10,1728]];
const MD={inc:{t:'مصدر دخل',col:'inc',f:[['name','الاسم','text'],['who','المستفيد','sel:ريان,عبدالعزيز'],['day','يوم النزول (1-31)','number'],['amt','المبلغ','number'],['on','فعّال','chk']]},
cat:{t:'التزام',col:'cats',f:[['name','الاسم','text'],['alloc','المبلغ الشهري','number'],['due','يوم الاستحقاق (اختياري)','number'],['who','القائم بالعمل','who'],['src','مصدر الدخل','src'],['src2','مصدر مساعد (اختياري)','src2'],['note','ملاحظة','text']]},
exp:{t:'مصروف',col:'exp',f:[['amt','المبلغ','number'],['cat','التصنيف','cat'],['desc','البيان','text'],['date','التاريخ','date']]}};
let db,ME={},S={inc:[],cats:[],exp:[],log:[],ecats:[],pay:[],settings:[],closed:[]},tab='home',W='عبدالعزيز',M={},pend=false,sync=null,cy,FP='all',FC='',FQ='',FD='',HX=false,HP=false,seeded=false,srv={},FO='all';
const $=s=>document.querySelector(s),E=t=>String(t??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const N=n=>Number(n||0).toLocaleString('en-US'),R=n=>N(n)+' <small>ريال</small>';
const today=()=>new Date(Date.now()-new Date().getTimezoneOffset()*6e4).toISOString().slice(0,10);
const nowL=()=>new Date(Date.now()-new Date().getTimezoneOffset()*6e4).toISOString().slice(0,16);
function ck(s){let[y,m,d]=s.split('-').map(Number);m--;if(d<28)m--;return new Date(y,m,28)}
const lab=d=>new Date(d.getFullYear(),d.getMonth()+1,27).toLocaleDateString('ar-SA-u-ca-gregory-nu-latn',{month:'long',year:'numeric'});
const rng=d=>{const e=new Date(d.getFullYear(),d.getMonth()+1,27),f=x=>x.toLocaleDateString('ar-SA-u-ca-gregory-nu-latn',{day:'numeric',month:'short'});return f(d)+' – '+f(e)};
const dateFor=d=>{const y=cy.getFullYear(),m=cy.getMonth(),t=d>=28?new Date(y,m,d):new Date(y,m+1,d);return t.getFullYear()+'/'+String(t.getMonth()+1).padStart(2,'0')+'/'+String(t.getDate()).padStart(2,'0')};
const dk=d=>d>=28?d-100:d;
function toast(t,ok=1){const e=$('#toast');e.textContent=t;e.style.background=ok?'#1f9d63':'#d64045';e.style.display='block';clearTimeout(e.t);e.t=setTimeout(()=>e.style.display='none',3200)}
async function logit(type,item,old,nw,reason){await db.collection('log').add({t:Date.now(),uid:ME.id,name:ME.name,type,item,old:old==null?'':String(old),nw:nw==null?'':String(nw),reason:reason||''})}
async function save(col,id,data,type,item,old,nw){try{await db.collection(col).doc(id).set(data);await logit(type,item,old,nw);toast('تم الحفظ ✓')}catch(e){toast('لم يُحفظ: '+(e.message||e.code),0)}}
async function upd(col,id,patch,type,item,old,nw){try{await db.collection(col).doc(id).update(patch);await logit(type,item,old,nw);toast('تم الحفظ ✓')}catch(e){toast('لم يُحفظ: '+(e.message||e.code),0)}}
const ecl=()=>S.ecats.filter(c=>!c.del&&(c.perm!==false||c.cyc==cy.getTime()));
const cname=id=>(S.ecats.find(c=>c.id==id)||S.cats.find(c=>c.id==id)||{}).name||'—';
function paid(cid){return S.pay.filter(p=>p.cat==cid&&p.st=='ok'&&ck(p.date).getTime()==cy.getTime()).reduce((a,p)=>a+p.amt,0)}
const acts=(t,id)=>`<button class="ic" onclick="openM('${t}','${id}')">✏️</button><button class="ic" onclick="delI('${t}','${id}')">🗑️</button>`;
function salT(a){return`<div class="card"><div class="ch"><h3>الرواتب لهذا الشهر</h3><button class="btn" onclick="openM('inc')">＋ إضافة راتب</button></div><table><thead><tr><th>#</th><th>المصدر</th><th>المستفيد</th><th>تاريخ الصرف</th><th>المبلغ</th><th></th></tr></thead><tbody>${[...a].sort((x,y)=>dk(x.day)-dk(y.day)).map((i,n)=>`<tr class="${i.on===false?'x':''}"><td>${n+1}</td><td style="cursor:pointer" onclick="openSrc('${i.id}')">${E(i.name)}${srcChips(i)}${srcSum(i)}</td><td><span class="bd ${i.who=='ريان'?'b2':'b1'}">${E(i.who)}</span></td><td>${dateFor(i.day)}</td><td><b>${N(i.amt)}</b></td><td>${acts('inc',i.id)}</td></tr>`).join('')||'<tr><td colspan=6>لا توجد بيانات</td></tr>'}</tbody></table></div>`}
function oblT(cs){return`<div class="card"><div class="ch"><h3>الالتزامات</h3><button class="btn r" onclick="openM('cat')">＋ إضافة التزام</button></div><table style="min-width:560px"><thead><tr><th>الالتزام</th><th>المبلغ</th><th>المسدّد</th><th>المتبقي</th><th>الاستحقاق</th><th></th></tr></thead><tbody>${[...cs].sort((a,b)=>(a.due>0?dk(a.due):99)-(b.due>0?dk(b.due):99)).map(c=>{const p=paid(c.id),r=c.alloc-p;return`<tr><td>${E(c.name)}${c.who||c.note?`<div class="sub">${c.who?'👤 '+E(c.who):''}${c.who&&c.note?' · ':''}${E(c.note||'')}</div>`:''}${srcLine(c)}</td><td><b>${N(c.alloc)}</b></td><td>${N(p)}</td><td>${r<0?`<span class="bd b3">زيادة ${N(-r)}</span>`:r==0&&c.alloc>0?'<span class="bd b2">مسدّد ✓</span>':`<span class="bd b4">${N(r)}</span>`}</td><td>${c.due>0?dateFor(c.due):'—'}</td><td style="white-space:nowrap"><button class="btn" style="padding:5px 10px" onclick="openObl('${c.id}')">سداد</button>${acts('cat',c.id)}</td></tr>`}).join('')||'<tr><td colspan=6>لا توجد بيانات</td></tr>'}</tbody></table></div>`}
function payT(){const l0=S.pay.filter(p=>ck(p.date).getTime()==cy.getTime()).sort((a,b)=>b.ts-a.ts),nx=l0.filter(p=>p.st!='ok').length,l=HP?l0:l0.filter(p=>p.st=='ok');return`<div class="card" style="margin-bottom:14px"><div class="ch"><h3>سدادات هذه الدورة</h3>${nx?`<button class="btn g" style="padding:6px 12px" onclick="HP=!HP;render()">${HP?'إخفاء الملغى':'الملغى ('+nx+')'}</button>`:''}</div><table><thead><tr><th>التاريخ</th><th>الالتزام</th><th>المبلغ</th><th>بواسطة</th><th></th></tr></thead><tbody>${l.map(p=>`<tr class="${p.st!='ok'?'x':''}"><td>${p.date}</td><td>${E(cname(p.cat))}</td><td><b>${N(p.amt)}</b></td><td>${E(p.by)}</td><td>${p.st=='ok'?`<button class="ic" onclick="cancelPay('${p.id}')">🗑️</button>`:(ME.admin?`<button class="ic" onclick="purge('pay','${p.id}')">🗑️ نهائي</button>`:'ملغى')}</td></tr>`).join('')||'<tr><td colspan=5>لا توجد سدادات</td></tr>'}</tbody></table></div>`}
